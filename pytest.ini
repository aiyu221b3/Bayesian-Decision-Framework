[pytest]
minversion = 9.0
addopts = --strict-config --strict-markers -ra
testpaths = src
python_files = test_*.py
pythonpath = src
markers =
    unit: focused deterministic component test
    property: bounded or Hypothesis property test
    integration: multi-module or subprocess test
    exploration: original bug-condition exploration retained until final remediation
    defect_clause(clause): traces a defect clause from 1.1 through 1.11
    preservation_clause(clause): traces a preservation clause from 3.1 through 3.9
    synthetic_only: requires no deferred real-data module or private artifact
    deferred_scope: tests only the unsupported future-pilot rejection boundary
